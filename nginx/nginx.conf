worker_processes auto;
rtmp_auto_push on;

events {
    worker_connections 1024;
}

# RTMP ingest — Meta glasses push here
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        notify_method get;

        application live {
            live on;
            record off;

            # Convert incoming RTMP to HLS
            hls on;
            hls_path /tmp/hls;
            hls_fragment 2s;
            hls_playlist_length 10s;
            hls_cleanup on;

            # Allow publish from any source (local network)
            allow publish all;
            allow play all;
        }
    }
}

# HTTP server to serve HLS output
http {
    sendfile off;
    tcp_nopush on;
    directio 512;

    server {
        listen 8080;

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location / {
            return 200 'RTMP server is running';
            add_header Content-Type text/plain;
        }
    }
}
