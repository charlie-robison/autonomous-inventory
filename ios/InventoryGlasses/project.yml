name: InventoryGlasses
options:
  bundleIdPrefix: com.inventoryglasses
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: "0.5.0"

targets:
  InventoryGlasses:
    type: application
    platform: iOS
    sources:
      - InventoryGlasses
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
    settings:
      base:
        INFOPLIST_FILE: InventoryGlasses/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.inventoryglasses.app
        INFOPLIST_KEY_CFBundleDisplayName: "Inventory Glasses"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
    entitlements:
      path: InventoryGlasses/InventoryGlasses.entitlements
